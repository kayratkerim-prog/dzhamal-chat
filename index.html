<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dzhamal AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: #0f172a; color: white; display: flex; height: 100vh; overflow: hidden; }

        /* Окно Авторизации */
        #authOverlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .auth-card { background: #1e293b; border: 1px solid #334155; padding: 30px; border-radius: 16px; width: 320px; display: flex; flex-direction: column; gap: 14px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .auth-card h2 { color: #818cf8; font-size: 22px; margin-bottom: 5px; }
        .auth-card input { padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; outline: none; }
        .auth-card input:focus { border-color: #6366f1; }
        .auth-card button { padding: 12px; background: #6366f1; border: none; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .auth-card button:hover { background: #4f46e5; }
        .auth-toggle { font-size: 13px; color: #94a3b8; cursor: pointer; }
        .auth-toggle span { color: #818cf8; text-decoration: underline; }

        /* Чат */
        .sidebar { width: 260px; background: #1e293b; padding: 15px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #334155; }
        .user-info { font-size: 13px; color: #94a3b8; padding: 8px; background: #0f172a; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .logout-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 12px; font-weight: bold; }
        .new-btn { background: #6366f1; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 14px; }
        .new-btn:hover { background: #4f46e5; }
        .chat-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .chat-item { padding: 10px 12px; background: #334155; border-radius: 6px; cursor: pointer; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-item:hover { background: #475569; }

        .main { flex: 1; display: flex; flex-direction: column; }
        .header { padding: 16px 20px; background: #0f172a; border-bottom: 1px solid #334155; font-weight: bold; font-size: 18px; color: #818cf8; }
        .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 75%; padding: 12px 16px; border-radius: 12px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
        .msg img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
        .user { background: #6366f1; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot { background: #1e293b; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }

        .input-container { padding: 16px 20px; background: #0f172a; border-top: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; }
        .preview-box { display: none; align-items: center; gap: 10px; background: #1e293b; padding: 6px 12px; border-radius: 8px; width: fit-content; }
        .preview-box img { height: 40px; border-radius: 4px; }
        .preview-box span { color: #ef4444; cursor: pointer; font-weight: bold; }

        .input-box { display: flex; gap: 10px; align-items: center; }
        input[type="text"] { flex: 1; padding: 12px 16px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; font-size: 15px; }
        input[type="text"]:focus { border-color: #6366f1; }
        .file-btn { background: #334155; padding: 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .file-btn:hover { background: #475569; }
        .send-btn { padding: 12px 24px; background: #6366f1; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; }
        .send-btn:hover { background: #4f46e5; }
    </style>
</head>
<body>

    <!-- Окно логина/регистрации -->
    <div id="authOverlay">
        <div class="auth-card">
            <h2 id="authTitle">Вход в Dzhamal AI</h2>
            <input type="email" id="authEmail" placeholder="Email">
            <input type="password" id="authPass" placeholder="Пароль">
            <button onclick="handleAuth()" id="authBtn">Войти</button>
            <div class="auth-toggle" onclick="toggleAuthMode()">
                <span id="authToggleText">Нет аккаунта? Зарегистрироваться</span>
            </div>
        </div>
    </div>

    <!-- Главный интерфейс -->
    <div class="sidebar">
        <div class="user-info">
            <span id="userEmailDisplay">user@mail.com</span>
            <button class="logout-btn" onclick="logout()">Выход</button>
        </div>
        <button class="new-btn" onclick="createNewChat()">+ Новый чат</button>
        <div class="chat-list" id="chatList"></div>
    </div>

    <div class="main">
        <div class="header">Dzhamal AI ⚡</div>
        <div class="messages" id="messages"></div>
        
        <div class="input-container">
            <div class="preview-box" id="previewBox">
                <img id="imagePreview" src="" alt="preview">
                <span onclick="removeImage()">✕</span>
            </div>
            <div class="input-box">
                <label class="file-btn" title="Прикрепить фото">
                    📷
                    <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                </label>
                <input type="text" id="userInput" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button class="send-btn" onclick="sendMessage()">Отправить</button>
            </div>
        </div>
    </div>

    <script>
        const API_KEY = "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";
        let isSignUp = false;
        let currentUser = localStorage.getItem('dzhamal_current_user') || null;
        let base64Image = null;

        let chats = [];
        let currentChatId = null;

        // --- АВТОРИЗАЦИЯ ---
        window.onload = () => {
            if (currentUser) {
                document.getElementById('authOverlay').style.display = 'none';
                initApp();
            }
        };

        function toggleAuthMode() {
            isSignUp = !isSignUp;
            document.getElementById('authTitle').textContent = isSignUp ? 'Регистрация' : 'Вход в Dzhamal AI';
            document.getElementById('authBtn').textContent = isSignUp ? 'Создать аккаунт' : 'Войти';
            document.getElementById('authToggleText').textContent = isSignUp ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
        }

        function handleAuth() {
            const email = document.getElementById('authEmail').value.trim();
            const pass = document.getElementById('authPass').value.trim();
            if (!email || !pass) return alert('Заполните Email и пароль!');

            let users = JSON.parse(localStorage.getItem('dzhamal_users')) || {};

            if (isSignUp) {
                if (users[email]) return alert('Пользователь с таким Email уже существует!');
                users[email] = pass;
                localStorage.setItem('dzhamal_users', JSON.stringify(users));
                alert('Регистрация успешна!');
            } else {
                if (!users[email] || users[email] !== pass) return alert('Неверный Email или пароль!');
            }

            currentUser = email;
            localStorage.setItem('dzhamal_current_user', currentUser);
            document.getElementById('authOverlay').style.display = 'none';
            initApp();
        }

        function logout() {
            localStorage.removeItem('dzhamal_current_user');
            location.reload();
        }

        // --- ЧАТЫ И ЛОГИКА ---
        function initApp() {
            document.getElementById('userEmailDisplay').textContent = currentUser;
            chats = JSON.parse(localStorage.getItem(`dzhamal_chats_${currentUser}`)) || [];
            currentChatId = localStorage.getItem(`dzhamal_active_${currentUser}`) || null;

            if (chats.length === 0) createNewChat();
            else {
                if (!currentChatId || !chats.find(c => c.id === currentChatId)) currentChatId = chats[0].id;
                renderSidebar();
                loadMessages();
            }
        }

        function createNewChat() {
            const newChat = { id: 'chat_' + Date.now(), title: 'Новый диалог', messages: [{ role: 'assistant', content: 'Салам! Я Dzhamal AI. Могу отвечать на текстовые вопросы и распознавать картинки!' }] };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            save();
            renderSidebar();
            loadMessages();
        }

        function save() {
            localStorage.setItem(`dzhamal_chats_${currentUser}`, JSON.stringify(chats));
            localStorage.setItem(`dzhamal_active_${currentUser}`, currentChatId);
        }

        function renderSidebar() {
            const list = document.getElementById('chatList');
            list.innerHTML = '';
            chats.forEach(c => {
                const item = document.createElement('div');
                item.className = 'chat-item';
                item.textContent = c.title;
                item.onclick = () => { currentChatId = c.id; save(); renderSidebar(); loadMessages(); };
                list.appendChild(item);
            });
        }

        function loadMessages() {
            const box = document.getElementById('messages');
            box.innerHTML = '';
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;

            chat.messages.forEach(m => {
                const div = document.createElement('div');
                div.className = `msg ${m.role === 'user' ? 'user' : 'bot'}`;
                
                if (typeof m.content === 'string') {
                    div.textContent = m.content;
                } else if (Array.isArray(m.content)) {
                    m.content.forEach(part => {
                        if (part.type === 'text') div.appendChild(document.createTextNode(part.text));
                        if (part.type === 'image_url') {
                            const img = document.createElement('img');
                            img.src = part.image_url.url;
                            div.appendChild(img);
                        }
                    });
                }
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        }

        // --- РАБОТА С ФОТО ---
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                base64Image = e.target.result;
                document.getElementById('imagePreview').src = base64Image;
                document.getElementById('previewBox').style.display = 'flex';
            };
            reader.readAsDataURL(file);
        }

        function removeImage() {
            base64Image = null;
            document.getElementById('fileInput').value = '';
            document.getElementById('previewBox').style.display = 'none';
        }

        // --- ОТПРАВКА СООБЩЕНИЙ ---
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text && !base64Image) return;

            const chat = chats.find(c => c.id === currentChatId);
            if (chat.messages.length <= 1) chat.title = (text || 'Фотография').substring(0, 18) + '...';

            let userContent;
            if (base64Image) {
                userContent = [];
                if (text) userContent.push({ type: "text", text: text });
                userContent.push({ type: "image_url", image_url: { url: base64Image } });
            } else {
                userContent = text;
            }

            chat.messages.push({ role: 'user', content: userContent });
            
            // Очищаем вводы
            input.value = '';
            const imgToSend = base64Image;
            removeImage();

            save();
            renderSidebar();
            loadMessages();

            // Индикатор ожидания
            const box = document.getElementById('messages');
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'msg bot';
            loadingDiv.textContent = 'Dzhamal AI думает...';
            box.appendChild(loadingDiv);
            box.scrollTop = box.scrollHeight;

            try {
                // Если с картиной — используем Мультимодальную модель Vision
                const modelName = imgToSend ? "llama-3.2-11b-vision-preview" : "llama-3.3-70b-versatile";

                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: modelName,
                        messages: [
                            { role: "system", content: "Ты — Dzhamal AI. Твоего создателя зовут Джамал. Отвечай подробно и помогай во всем." },
                            ...chat.messages
                        ]
                    })
                });

                const data = await res.json();
                box.removeChild(loadingDiv);

                if (data.choices && data.choices[0]) {
                    const reply = data.choices[0].message.content;
                    chat.messages.push({ role: 'assistant', content: reply });
                } else {
                    chat.messages.push({ role: 'assistant', content: 'Ошибка при анализе.' });
                }
            } catch (e) {
                if (box.contains(loadingDiv)) box.removeChild(loadingDiv);
                chat.messages.push({ role: 'assistant', content: 'Ошибка соединения с сервером.' });
            }

            save();
            loadMessages();
        }
    </script>
</body>
</html>
